services:
  collaboration:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:5097:8080"
    environment:
      VECTORSPACE_CREATE_KEY: ${VECTORSPACE_CREATE_KEY:?Set a random room-creation key of at least 32 characters}
      VECTORSPACE_DATA: /data/vectorspace
      VECTORSPACE_ALLOWED_ORIGINS: ${VECTORSPACE_ALLOWED_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173,https://wieslawsoltes.github.io}
    volumes:
      - collaboration-data:/data/vectorspace
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  collaboration-data:
