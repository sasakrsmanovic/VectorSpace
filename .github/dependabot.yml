version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      uno-skia:
        patterns: ['Uno.*', 'SkiaSharp*', 'HarfBuzzSharp*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
