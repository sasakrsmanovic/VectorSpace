name: Engine and document tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Execute engine, document and editing tests
        run: dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Archive complete source snapshot
        if: always()
        run: git archive --format=zip --output=/tmp/VectorSpace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VectorSpace-source
          path: /tmp/VectorSpace-source.zip
          retention-days: 7
