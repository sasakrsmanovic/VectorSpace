name: PR16 pinned source review
on:
  push:
    branches: ['ci/pr16-review-source']
    paths: ['.github/workflows/pr16-review-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: af6a3b20fd626b96b2adf7c5288dddcdeda52494
          persist-credentials: false
      - name: Archive the exact candidate, without this temporary workflow
        run: |
          test "$(git rev-parse HEAD)" = af6a3b20fd626b96b2adf7c5288dddcdeda52494
          git archive --format=zip --output=/tmp/VectorSpace-pr16-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: VectorSpace-pr16-pinned-source
          path: /tmp/VectorSpace-pr16-source.zip
          retention-days: 7
