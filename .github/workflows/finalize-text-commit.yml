name: Finalize text commit barrier
on:
  push:
    branches: ['feat/tool-editing-0.5']
    paths: ['.github/workflows/finalize-text-commit.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed text synchronization fix
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          path='src/VectorSpace.Editor/DesignSurface.cs'
          assert subprocess.check_output(['git','hash-object',path],text=True).strip()=='72b88cab76dced001e6b2a966fee1aa7bf010f62'
          p=pathlib.Path(path);s=p.read_text()
          old='        box.TextChanged += (_, _) => { if (_textNode is null) return; _textNode.Text = box.Text; ComponentService.SetOverride(_textNode, text: box.Text); };'
          new='''        // TextChanged is asynchronous; immediate Save/Enter can otherwise commit the
                  // previous value. Synchronize model data without touching the visual tree here.
                  box.TextChanging += (_, _) => { if (!ReferenceEquals(_textEditor, box) || _textNode is null) return; _textNode.Text = box.Text; ComponentService.SetOverride(_textNode, text: box.Text); };'''
          assert s.count(old)==1;s=s.replace(old,new)
          old='''        var returnFocus = box.FocusState != FocusState.Unfocused;
                  _textEditor = null; _textNode = null; _overlay.Children.Remove(box);'''
          new='''        var returnFocus = box.FocusState != FocusState.Unfocused;
                  if (commit && _textNode is { } node)
                  {
                      // Read the editor synchronously before teardown as a final commit barrier.
                      node.Text = box.Text; ComponentService.SetOverride(node, text: box.Text);
                  }
                  _textEditor = null; _textNode = null; _overlay.Children.Remove(box);'''
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
          assert actual=='2ee8035dc7d0b9e16d86e6ba6a0aed84f67a405c',actual
          print('Text synchronization source matches the reviewed blob exactly.')
          PY
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate engine and reusable workbench
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          python3 -m unittest discover -s tests/scripts -v
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit validated text synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VectorSpace.Editor/DesignSurface.cs
          git commit -m 'fix: synchronize text before saving or committing the canvas editor'
          git push origin HEAD:feat/tool-editing-0.5
