name: Finalize design-system integration
on:
  push:
    branches: ['feat/editor-parity-0.2']
    paths: ['.github/workflows/finalize-design-system.yml']
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/editor-parity-0.2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Integrate reviewed UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/VectorSpace.Workbench/StudioWorkbench.Commands.cs')
          s=p.read_text()
          old='''        var nodes = Session.SelectionRoots.Select(n =>
                  {
                      var clone = DocumentJson.CloneNode(n); NodeGeometry.SetLocalMatrix(clone, n.WorldMatrix); return clone;
                  }).ToArray();
                  _clipboard = ClipboardPrefix + DocumentJson.SaveNodes(nodes);'''
          assert old in s
          s=s.replace(old,'        _clipboard = ClipboardPrefix + Session.CopySelection();')
          s=s.replace('var dialog = Dialog("Quick actions", root);','var dialog = Dialog("Quick actions", root); Action? selectedAction = null;')
          s=s.replace('button.Click += (_, _) => { dialog.Hide(); DispatcherQueue.TryEnqueue(() => item.Execute()); };','button.Click += (_, _) => { selectedAction = item.Execute; dialog.Hide(); };')
          s=s.replace('Filter(); await dialog.ShowAsync();','Filter(); await dialog.ShowAsync(); selectedAction?.Invoke();')
          p.write_text(s)
          p=Path('src/VectorSpace.Workbench/StudioWorkbench.cs');s=p.read_text()
          s=s.replace('    private string _layerSignature = "";','    private StudioButton? _createComponentButton;\n    private string _layerSignature = "";')
          s=s.replace('            RefreshLayerSelection(); RefreshInspector();','            RefreshLayerSelection(); RefreshInspector();\n            if (_createComponentButton is not null) _createComponentButton.IsEnabled = Session.SelectionRoots.Count == 1;')
          s=s.replace('root.Children.Add(new StudioButton("Create component from selection", () => Run(() => ComponentService.MakeComponent(Session))) { RestBackground = Studio.Field, Background = Studio.Brush(Studio.Field), IsEnabled = Session.SelectionRoots.Count == 1 });','_createComponentButton = new StudioButton("Create component from selection", () => Run(() => ComponentService.MakeComponent(Session))) { RestBackground = Studio.Field, Background = Studio.Brush(Studio.Field), IsEnabled = Session.SelectionRoots.Count == 1 };\n        root.Children.Add(_createComponentButton);')
          p.write_text(s)
          PY
      - name: Validate engines and Uno workbench
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit validated UI fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: preserve variable clipboard dependencies and sequence modal actions correctly'
          git push origin HEAD:feat/editor-parity-0.2
          gh workflow run build.yml --ref feat/editor-parity-0.2
          gh workflow run desktop.yml --ref feat/editor-parity-0.2
