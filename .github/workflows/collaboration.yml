name: Collaboration
on:
  push:
    branches: [main, 'feat/collaboration-0.6']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collaboration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Collaboration convergence and conditional history
        run: dotnet run --project tests/VectorSpace.Collaboration.Tests -c Release
      - name: Existing editor regressions
        run: dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Compile the persistent service
        run: dotnet build server/VectorSpace.Server -c Release
      - name: Actual network and restart tests
        run: python3 -m unittest discover -s tests/server -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VectorSpace-collaboration-validation
          path: artifacts/collaboration-server.log
          if-no-files-found: ignore
