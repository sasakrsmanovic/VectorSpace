name: Integrate validated source corrections
on:
  workflow_dispatch:
  push:
    paths: ['scripts/integrate-source.py']
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and validate authored source corrections
        run: |
          if test -f scripts/integrate-source.py; then python3 scripts/integrate-source.py; fi
          dotnet run --project tests/VectorSpace.Tests -c Release
          npm install --package-lock-only --ignore-scripts
      - name: Commit validated source and lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: integrate validated editor corrections and lock browser test dependencies'
            git push origin HEAD:main
          fi
          gh workflow run build.yml --ref main
