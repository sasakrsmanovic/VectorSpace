name: Validate selection-only boundary
on:
  push:
    branches: ['ci/pr16-selection-boundary']
    paths: ['.github/workflows/pr16-selection-boundary.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6c6d805ee691602012137a2425ab1bef891cf454
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply exact guarded source changes
        shell: python
        run: |
          from pathlib import Path
          def edit(path, old, new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old[:80],s.count(old));p.write_text(s.replace(old,new))
          p='src/VectorSpace.Editor/DesignSurface.cs'
          edit(p,'    private DesignNode? _pendingDuplicate;', '    private DesignNode? _pendingDuplicate;\n    private bool _moveStarted;')
          edit(p,'            editor.BeginInteraction(alt ? "Duplicate layers" : "Move layers");\n            _pendingDuplicate = alt ? hit : null;\n            CaptureOriginals(); _gesture = Gesture.Move;', '            // Selection alone must not normalize layout, clone the document into\n            // history or enqueue a collaborative edit. Capture the drag only once\n            // pointer movement crosses its threshold; current permissions and node\n            // identities are checked then. A remote document replacement cancels\n            // the pending gesture through SessionChanged before it can activate.\n            _pendingDuplicate = alt ? hit : null;\n            _moveStarted = false; _gesture = Gesture.Move;')
          edit(p,'            case Gesture.Move:\n                if (screen.DistanceTo(_startScreen) < 3) break;\n                if (_pendingDuplicate is not null)', '            case Gesture.Move:\n                if (!_moveStarted)\n                {\n                    if (screen.DistanceTo(_startScreen) < 3) break;\n                    editor.BeginInteraction(_pendingDuplicate is null ? "Move layers" : "Duplicate layers");\n                    CaptureOriginals(); _moveStarted = true;\n                }\n                if (_pendingDuplicate is not null)')
          edit(p,'        else if (gesture is not Gesture.None and not Gesture.Pan and not Gesture.Marquee and not Gesture.PenControl) editor.CommitInteraction();\n        _marquee = null; _guide = null; _snapLines = []; RequestFrame();', '        else if (gesture is not Gesture.None and not Gesture.Pan and not Gesture.Marquee and not Gesture.PenControl &&\n            (gesture != Gesture.Move || _moveStarted)) editor.CommitInteraction();\n        _moveStarted = false; _pendingDuplicate = null;\n        _marquee = null; _guide = null; _snapLines = []; RequestFrame();')
          edit(p,'_gesture = Gesture.None; _created = null; _penNode = null;', '_gesture = Gesture.None; _moveStarted = false; _pendingDuplicate = null; _created = null; _penNode = null;')
          edit(p,'_pendingDuplicate = null; _gesture = Gesture.None; _created', '_pendingDuplicate = null; _moveStarted = false; _gesture = Gesture.None; _created')
          edit('tests/browser/contour-extents.spec.mjs', '    await expect.poll(async () => (await state(page)).id).toBe(original.id);', '    await expect.poll(async () => (await state(page)).id).toBe(original.id);\n    // A selection-only click is not a geometry transaction. In particular it\n    // must not run frame layout and inflate a native primitive\'s zero axis.\n    expect(await state(page)).toMatchObject({ history: 0, interacting: false,\n      width: original.width, height: original.height });')
          edit('docs/CONTOURS.md','Click an anchor to select it;', 'Layer selection itself does not begin a move transaction or normalize geometry. Drag capture, document-history snapshots and snapping baselines are deferred until the pointer crosses the movement threshold; a remote document replacement before activation cancels the pending gesture.\n\nClick an anchor to select it;')
          edit('docs/CONTOURS.md','Point dragging now captures and reapplies only the selected anchors/handles, **O(k)** after retaining topology, rather than copying/resetting all n anchors per pointer sample.', 'Point dragging reapplies only the selected anchors/handles in **O(k)** per sample after retaining topology, rather than resetting all n anchors. Capture also validates the retained contour lists and deduplicates/sorts the selection; it is not an O(k) guarantee for the entire gesture setup.')
          edit('docs/VALIDATION.md','Two further cases convert zero-extent lines/arrows through Enter,', 'Two further cases verify selection-only clicks preserve zero-extent primitives without starting history, convert lines/arrows through Enter,')
          edit('CHANGELOG.md','- Preserve world geometry and authored rotation/reflection when converting zero/subpixel lines and arrows;', '- Defer move transactions and baseline capture until the pointer crosses its threshold; selection-only clicks no longer normalize document geometry or create history.\n- Keep open-arc fills hidden when converting to editable contours, preserving latent paints and undo.\n- Preserve world geometry and authored rotation/reflection when converting zero/subpixel lines and arrows;')
          edit('CHANGELOG.md','Add 25 native regressions and two actual-browser conversion/resize workflows during final review', 'Add 27 native regressions and three actual-browser conversion/resize/appearance workflows during final review')
      - name: Verify exact reviewed tree
        run: |
          git add src tests docs CHANGELOG.md
          git diff --cached --check
          test "$(git write-tree)" = 60ac5e2d3ad2974a01e8cf112450880a190ba3d6
      - name: Engine regressions and reusable Uno compilation
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Preserve validated source on a staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: defer move transactions until pointer activation and preserve selection-only geometry'
          git push origin HEAD:ci/pr16-validated-selection
