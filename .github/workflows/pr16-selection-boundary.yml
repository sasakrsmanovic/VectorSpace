name: Validate pending selection cancellation
on:
  push:
    branches: ['ci/pr16-selection-boundary']
    paths: ['.github/workflows/pr16-selection-boundary.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: caead2fa192326c2ba67be01687b8f6c689a95a6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply guarded pending-gesture cancellation
        shell: python
        run: |
          from pathlib import Path
          def edit(path, old, new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old[:80],s.count(old));p.write_text(s.replace(old,new))
          edit('src/VectorSpace.Editor/DesignSurface.cs','else if (Session?.IsInteracting == true && !IsTextEditing) CancelGesture();','else if ((Session?.IsInteracting == true || _gesture == Gesture.Move) && !IsTextEditing) CancelGesture();')
          edit('src/VectorSpace.Editor/DesignSurface.ToolEditing.cs','_gesture = Gesture.None; _canvas.ReleasePointerCaptures();','_gesture = Gesture.None; _moveStarted = false; _pendingDuplicate = null; _canvas.ReleasePointerCaptures();')
          old='    expect(await state(page)).toMatchObject({ history: 0, interacting: false,\n      width: original.width, height: original.height });'
          extra='\n    // Switching tools during a not-yet-started drag must release the pending\n    // capture, not activate an old Move gesture on the next pointer sample.\n    const pending = await screen(page, original.x + original.width / 4, original.y + original.height / 4);\n    await page.mouse.move(pending.x, pending.y); await page.mouse.down();\n    expect((await state(page)).interacting).toBe(false);\n    await page.keyboard.press(\'r\'); await expect.poll(async () => (await state(page)).tool).toBe(\'Rectangle\');\n    await page.mouse.move(pending.x + 20, pending.y + 20, { steps: 3 }); await page.mouse.up();\n    expect(await state(page)).toMatchObject({ history: 0, interacting: false, x: original.x, y: original.y,\n      width: original.width, height: original.height });\n    await page.keyboard.press(\'v\');'
          edit('tests/browser/contour-extents.spec.mjs',old,old+extra)
          edit('docs/CONTOURS.md','a remote document replacement before activation cancels the pending gesture.','a tool switch or remote document replacement before activation cancels the pending gesture.')
      - name: Verify exact reviewed tree
        run: |
          git add src tests docs
          git diff --cached --check
          test "$(git write-tree)" = cc3f2886a4952b2d716b3bcb6749e5d196d2c40f
      - name: Validate engine and reusable controls
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Preserve validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: cancel pending layer drags when changing tools or completing commands'
          git push origin HEAD:refs/heads/ci/pr16-validated-selection
