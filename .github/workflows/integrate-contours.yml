name: Finalize compound vector editing
on:
  push:
    branches: ['feat/compound-vector-editing-0.9']
    paths: ['scripts/finish-contours.txt', '.github/workflows/integrate-contours.yml']
permissions:
  contents: write
concurrency:
  group: integrate-contours
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Preserve reviewed source and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          transfer = Path('scripts/finish-contours.txt')
          patch = lzma.decompress(base64.b64decode(transfer.read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c6913d68490f63b9e539cbc4b88f16db39176ad92cec8e598217df4fdbb17a5d'
          assert b'diff --git a/.github/' not in patch
          Path('/tmp/finish-contours.patch').write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--check','/tmp/finish-contours.patch'], check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/finish-contours.patch'], check=True)
          transfer.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md scripts/finish-contours.txt
          git diff --cached --check
          git commit -m 'fix: finalize compound subdivision, canonical persistence and vector playground workflows'
          git push origin HEAD:feat/compound-vector-editing-0.9
      - name: Engine regressions and scoped sparse capture benchmark
        run: |
          mkdir -p artifacts
          dotnet run --project tests/VectorSpace.Tests -c Release > artifacts/contour-engine.log 2>&1 || { grep -A10 -E 'FAIL|error' artifacts/contour-engine.log; tail -5 artifacts/contour-engine.log; exit 1; }
          tail -3 artifacts/contour-engine.log
          dotnet run --project tests/VectorSpace.Tests -c Release --no-build -- --benchmark-contours > artifacts/contours.json
          cat artifacts/contours.json
      - name: Compile reusable custom Uno controls and editor
        if: always()
        run: dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Actual collaboration projection and persisted room upgrade
        if: always()
        run: |
          dotnet run --project tests/VectorSpace.Collaboration.EditorTests -c Release
          dotnet build server/VectorSpace.Server -c Release
          python3 -m unittest discover -s tests/server -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compound-final-integration
          path: |
            artifacts/contour-engine.log
            artifacts/contours.json
            artifacts/collaboration-server.log
          if-no-files-found: ignore
