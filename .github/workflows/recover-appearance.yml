name: Recover appearance source
on:
  push:
    branches: ['feat/appearance-parity-0.4']
    paths: ['.github/workflows/recover-appearance.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Recover original checksum-verified source
        run: |
          python3 -u - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, zlib, time
          expected='7a66268d38b873dd0bf0a823083a868ac99251fd9fcffe9faec6d10cc87dd881'
          paths=sorted(pathlib.Path('scripts/appearance-transfer').glob('*.b64'))
          text=''.join(p.read_text().strip() for p in paths)
          for p in paths: print('PART',p,len(p.read_text().strip()),hashlib.sha256(p.read_bytes()).hexdigest())
          raw=base64.b64decode(text,validate=True)
          def verified(raw):
              try:
                  patch=gzip.decompress(raw)
                  return patch if hashlib.sha256(patch).hexdigest()==expected else None
              except (OSError,EOFError,zlib.error): return None
          patch=verified(raw)
          if patch is None:
              decoder=zlib.decompressobj(31); output=bytearray(); failed=len(raw)
              for offset, value in enumerate(raw):
                  try: output.extend(decoder.decompress(bytes([value])))
                  except zlib.error as error:
                      failed=offset; print('FIRST ERROR byte',offset,'base64 near',offset*4//3,str(error)); break
              print('LAST DECODED SOURCE',repr(bytes(output[-3000:])))
              index=failed*4//3
              print('ENCODED CONTEXT',index,repr(text[max(0,index-160):index+80]))
              alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              start=time.monotonic()
              # Most transcription damage is close to the failing deflate block.
              # Accept only the exact pre-existing source digest, never a plausible decode.
              lo=max(0,index-1024); hi=min(len(text),index+12)
              for i in range(hi-1,lo-1,-1):
                  old=text[i]
                  for ch in alphabet:
                      if ch==old: continue
                      candidate=text[:i]+ch+text[i+1:]
                      patch=verified(base64.b64decode(candidate))
                      if patch is not None:
                          print('RECOVERED CHARACTER',i,old,'->',ch); break
                  if patch is not None: break
              print('RECOVERY SECONDS',time.monotonic()-start)
          if patch is None: raise SystemExit('No exact checksum match. Source was not applied or committed.')
          assert hashlib.sha256(patch).hexdigest()==expected
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('+++ b/'):
                  path=line[6:]
                  assert '..' not in path.split('/') and (path.startswith(('src/','tests/','docs/')) or path in ('README.md','CHANGELOG.md','Directory.Build.props','.gitignore'))
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          print('SOURCE VERIFIED',expected,len(patch))
          subprocess.run(['git','diff','--stat'],check=True)
          PY
      - name: Preserve recovered implementation for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -r scripts/appearance-transfer
          git add src tests docs README.md CHANGELOG.md Directory.Build.props .gitignore scripts/appearance-transfer
          git commit -m 'feat: recover original image fill, crop, effect stack and SVG appearance implementation'
          git push origin HEAD:feat/appearance-parity-0.4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate recovered engines and native workbench
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          python3 -m unittest discover -s tests/scripts -v
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
