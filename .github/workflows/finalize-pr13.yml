name: Finalize collaboration boundaries
on:
  push:
    branches: ['feat/collaboration-0.6']
    paths: ['.github/workflows/finalize-pr13.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply guarded finalization and correct comment selectors
        run: |
          python3 scripts/finalize-pr13.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/collaboration.spec.mjs');s=p.read_text()
          replacements={
              "input(review, 'Add a comment', 'Review from another window'); await click(review, 'Continue')": "input(review, 'Leave a comment', 'Review from another window'); await click(review, 'Save')",
              "input(page, 'Reply', 'First response')": "input(page, 'Reply to comment', 'First response')",
              "input(bob, 'Reply', 'Second response')": "input(bob, 'Reply to comment', 'Second response')"
          }
          for old,new in replacements.items():
              assert s.count(old)==1,old
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Validate original and collaborative editor regressions
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet run --project tests/VectorSpace.Collaboration.Tests -c Release
          dotnet run --project tests/VectorSpace.Collaboration.EditorTests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Preserve validated input boundaries and release documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/finalize-pr13.py .github/workflows/finalize-pr13.yml
          git add src tests docs CHANGELOG.md .gitignore scripts/finalize-pr13.py .github/workflows/finalize-pr13.yml
          git diff --cached --check
          git commit -m 'fix: contain revoked input transactions and finalize collaboration delivery'
          git push origin HEAD:feat/collaboration-0.6
