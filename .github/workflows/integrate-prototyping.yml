name: Integrate prototype runtime
on:
  push:
    branches: ['feat/prototype-runtime-0.3']
    paths: ['.github/workflows/integrate-prototyping.yml', 'scripts/integrate-prototyping.py']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prototype-runtime-0.3
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Integrate reviewed prototype source
        run: python3 scripts/integrate-prototyping.py
      - name: Run engine and prototype regression suite
        run: dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Compile reusable native Uno workbench
        run: dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit integrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests Directory.Build.props README.md VectorSpace.slnx
          git commit -m 'feat: integrate isolated prototype playback and declarative authoring'
          git push origin HEAD:feat/prototype-runtime-0.3
      - name: Retain diagnostics
        if: failure()
        run: git diff > /tmp/prototype-integration.patch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: prototype-integration-diagnostic
          path: /tmp/prototype-integration.patch
