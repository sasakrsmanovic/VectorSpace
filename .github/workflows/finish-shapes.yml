name: Validate final shape integration
on:
  push:
    branches: ['feat/shape-stroke-editing-0.8']
    paths: ['.github/workflows/finish-shapes.yml', 'scripts/finish-shapes.py']
permissions:
  contents: write
concurrency:
  group: finish-shapes
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply guarded source integration
        run: |
          python3 scripts/finish-shapes.py
          # Workflow changes are committed separately through the authorized GitHub
          # connection. This job keeps only contents permission and does not need
          # permission to modify any workflow.
          git restore --source=HEAD -- .github/workflows/build.yml
      - name: Engine and exact stroke-extent regressions
        run: |
          mkdir -p artifacts
          dotnet run --project tests/VectorSpace.Tests -c Release > artifacts/shape-engine.log 2>&1 || { grep -A12 -E 'FAIL|error' artifacts/shape-engine.log; tail -5 artifacts/shape-engine.log; exit 1; }
          tail -3 artifacts/shape-engine.log
      - name: Actual server schema upgrades and restart
        run: |
          dotnet build server/VectorSpace.Server -c Release
          python3 -m unittest discover -s tests/server -v
      - name: Compile reusable Uno workbench
        run: dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Preserve validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/finish-shapes.py
          git add src tests docs README.md CHANGELOG.md scripts/finish-shapes.py
          git commit -m 'fix: finalize native shape integration, persisted schema upgrades and documentation'
          git push origin HEAD:feat/shape-stroke-editing-0.8
      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          git diff > artifacts/final-shape-integration.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-shape-integration-validation
          path: |
            artifacts/shape-engine.log
            artifacts/collaboration-server.log
            artifacts/final-shape-integration.patch
