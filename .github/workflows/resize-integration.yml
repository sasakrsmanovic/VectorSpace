name: Integrate reviewed resize changes
on:
  push:
    branches: ['fix/resize-anchors-and-sizing']
    paths: ['.github/workflows/resize-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/resize-anchors-and-sizing
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Integrate reviewed source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/VectorSpace.Editor/DesignSurface.cs')
          s = p.read_text()
          start = s.index('    private void ResizeSelection(')
          end = s.index('    private void Wheel(', start)
          s = s[:start] + s[end:]
          s = s.replace('editor.SelectionRoots.Count > 0 && editor.SelectionRoots.Count > 0 &&', 'editor.SelectionRoots.Count > 0 &&')
          p.write_text(s)
          p = Path('tests/VectorSpace.Tests/Program.cs'); s = p.read_text()
          assert 'ResizeTests.Register(Test);' not in s
          p.write_text(s.replace('ParityTests.Register(Test);', 'ParityTests.Register(Test);\nResizeTests.Register(Test);'))
          for name in ['Directory.Build.props', 'README.md']:
              p = Path(name); s = p.read_text().replace('0.2.0-alpha.1', '0.2.0-alpha.2')
              p.write_text(s.replace('baseline alignment, hug sizing,', 'axis-preserving hug/fill resize, hug sizing,'))
          p = Path('CHANGELOG.md'); s = p.read_text().replace('baseline alignment, ', '')
          notes = '\n## 0.2.0-alpha.2\n\n- Preserve hug/fill on untouched sizing axes during handle drags; horizontal resizing now reflows wrapping hug-height frames.\n- Keep opposite edges and centers stationary at min/max constraints, including nested rotation/reflection.\n- Fix proportional side-handle shrinking and centered proportional resizing; add reusable allocation-free resize geometry.\n- Add 23 native regressions and two browser workflows, for 168 engine tests and nine browser tests.\n- Correct the prior documentation: gesture baselines are implemented; text-baseline alignment is not.\n'
          p.write_text(s.replace('# Changelog\n', '# Changelog\n' + notes, 1))
          p = Path('docs/FEATURES.md'); s = p.read_text().replace('baseline estimates, ', '')
          s = s.replace('This does not certify every Figma precedence or text-baseline case.', 'Text-baseline alignment is not implemented; this does not certify every Figma layout precedence rule.')
          s = s.replace('baseline-based move/resize/rotation;', 'baseline-based move/resize/rotation with anchored min/max limits and axis-preserving hug/fill;')
          p.write_text(s)
          p = Path('docs/VALIDATION.md'); s = p.read_text().replace('covers 145 scenarios', 'covers 168 scenarios').replace('wrap/grid/baseline and scoped selection behavior', 'wrap/grid, baseline-relative resize gestures and scoped selection behavior')
          p.write_text(s + '\n## Resize follow-up\n\nTwenty-three additional native cases cover all handles under rotation/reflection, anchored size clamping, retained hug/fill, proportional side shrinking, reflow, and history. Two browser tests import documents, drag handles, check undo/redo and inspect saved hug-height state. Together with the design-system and original editor tests this makes nine browser cases. See [resizing semantics](RESIZING.md). Passing results must be checked on the exact commit; test counts describe the suite, not a guarantee that an unexecuted build passed.\n')
          PY
      - name: Validate all engine regressions and native workbench
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit tested source edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VectorSpace.Editor/DesignSurface.cs tests/VectorSpace.Tests/Program.cs Directory.Build.props README.md CHANGELOG.md docs/FEATURES.md docs/VALIDATION.md
          git commit -m 'fix: integrate anchored resizing and preserve untouched layout axes'
          git push origin HEAD:fix/resize-anchors-and-sizing
