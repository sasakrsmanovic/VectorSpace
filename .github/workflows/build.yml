name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Skia input-readiness harness
        run: node --test tests/browser-harness/*.test.mjs
      - name: Validate publication metadata and asset collection
        run: python3 -m unittest discover -s tests/scripts -v
      - run: dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Measure snapping, retained appearance and editing workflows
        run: |
          mkdir -p artifacts/benchmarks
          dotnet run --project tests/VectorSpace.Tests -c Release --no-build -- --benchmark > artifacts/benchmarks/snap-index.json
          cat artifacts/benchmarks/snap-index.json
          dotnet run --project tests/VectorSpace.Tests -c Release --no-build -- --benchmark-appearance > artifacts/benchmarks/appearance.json
          cat artifacts/benchmarks/appearance.json
          dotnet run --project tests/VectorSpace.Tests -c Release --no-build -- --benchmark-editing > artifacts/benchmarks/editing.json
          cat artifacts/benchmarks/editing.json
          dotnet run --project tests/VectorSpace.Tests -c Release --no-build -- --benchmark-workflows > artifacts/benchmarks/editing-workflows.json
          cat artifacts/benchmarks/editing-workflows.json
          dotnet run --project tests/VectorSpace.Tests -c Release --no-build -- --benchmark-shapes > artifacts/benchmarks/shapes.json
          cat artifacts/benchmarks/shapes.json
      - uses: actions/upload-artifact@v7
        with:
          name: VectorSpace-performance
          path: artifacts/benchmarks
  collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate shared transactions and actual editor integration
        run: |
          dotnet run --project tests/VectorSpace.Collaboration.Tests -c Release
          dotnet run --project tests/VectorSpace.Collaboration.EditorTests -c Release
      - name: Compile and exercise the persistent server over HTTP
        run: |
          dotnet build server/VectorSpace.Server -c Release
          python3 -m unittest discover -s tests/server -v
      - name: Measure property projection and exact wire reduction
        run: |
          mkdir -p artifacts/collaboration-benchmarks
          dotnet run --project tests/VectorSpace.Collaboration.EditorTests -c Release --no-build -- --benchmark > artifacts/collaboration-benchmarks/collaboration.json
          cat artifacts/collaboration-benchmarks/collaboration.json
      - name: Publish self-hostable server
        run: dotnet publish server/VectorSpace.Server -c Release -o artifacts/collaboration-server
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VectorSpace-collaboration-validation
          path: |
            artifacts/collaboration-server.log
            artifacts/collaboration-benchmarks
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: VectorSpace-collaboration-server
          path: artifacts/collaboration-server
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser toolchain and licensed assets
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
      - name: Publish actual Uno WebAssembly application
        run: |
          dotnet publish src/VectorSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/VectorSpace/
          python3 scripts/collect-site.py artifacts/publish artifacts/site
          du -sh artifacts/site
      - name: Build reusable NuGet packages
        run: |
          for project in src/*/*.csproj; do
            case "$project" in */VectorSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - name: Test real browser and multi-user interactions
        run: |
          npm ci
          npx playwright install --with-deps chromium
          dotnet build server/VectorSpace.Server -c Release
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          python3 scripts/run-collaboration-browser-tests.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VectorSpace-browser
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VectorSpace-packages
          path: artifacts/packages
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VectorSpace-browser-validation
          path: |
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/test-results
            artifacts/browser-results.xml
            artifacts/server.log
            artifacts/collaboration-browser-server.log
          if-no-files-found: ignore
      - name: Source snapshot
        if: always()
        run: git archive --format=zip --output=/tmp/VectorSpace-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VectorSpace-source
          path: /tmp/VectorSpace-source.zip
