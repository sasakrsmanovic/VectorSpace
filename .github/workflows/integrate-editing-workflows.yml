name: Integrate editing workflows
on:
  push:
    branches: ['feat/editing-workflows-0.7']
    paths: ['.github/workflows/integrate-editing-workflows.yml', 'scripts/integrate-editing-workflows.py']
permissions:
  contents: write
concurrency:
  group: integrate-editing-workflows
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply guarded existing-source edits
        run: python3 scripts/integrate-editing-workflows.py
      - name: Validate editor, properties, collaboration and migration
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet run --project tests/VectorSpace.Collaboration.Tests -c Release
          dotnet run --project tests/VectorSpace.Collaboration.EditorTests -c Release
          python3 -m unittest discover -s tests/scripts -v
      - name: Compile the reusable Uno workbench and persistent service
        run: |
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
          dotnet build server/VectorSpace.Server -c Release
          python3 -m unittest discover -s tests/server -v
      - name: Preserve validated source and remove temporary integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/integrate-editing-workflows.py .github/workflows/integrate-editing-workflows.yml
          git add src tests Directory.Build.props scripts/integrate-editing-workflows.py .github/workflows/integrate-editing-workflows.yml
          git commit -m 'feat: integrate property transfer, instance style overrides, batch renaming and stable layer order'
          git push origin HEAD:feat/editing-workflows-0.7
