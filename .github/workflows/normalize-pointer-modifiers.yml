name: Normalize browser pointer modifiers
on:
  push:
    branches: ['fix/resize-anchors-and-sizing']
    paths: ['.github/workflows/normalize-pointer-modifiers.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/resize-anchors-and-sizing
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Normalize modifiers and extend real browser coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/VectorSpace.Editor/DesignSurface.cs'); s = p.read_text()
          needle = 'e.KeyModifiers.HasFlag(VirtualKeyModifiers.Menu)'
          assert s.count(needle) == 4
          s = s.replace(needle, '(Keyboard.Alt || e.KeyModifiers.HasFlag(VirtualKeyModifiers.Menu))')
          p.write_text(s)
          p = Path('tests/browser/resize.spec.mjs'); s = p.read_text()
          old = '  expect(result.x + result.width / 2).toBeCloseTo(350, 3); expect(result.y + result.height / 2).toBeCloseTo(280, 3);'
          assert old in s
          extra = '''
            // Alt is available from keyboard state even when the host omits it from pointer args.
            await page.keyboard.press('Control+z'); await expect.poll(async () => (await state(page)).width).toBe(100);
            const beforeDuplicate = await state(page);
            await page.keyboard.down('Alt'); await drag(page, [350, 280], [500, 360]); await page.keyboard.up('Alt');
            await expect.poll(async () => (await state(page)).nodes).toBe(beforeDuplicate.nodes + 1);
            expect((await state(page)).id).not.toBe('target');
            await page.keyboard.press('Control+z'); await expect.poll(async () => (await state(page)).nodes).toBe(beforeDuplicate.nodes);
            await page.keyboard.press('r'); await page.keyboard.down('Alt');
            await drag(page, [500, 430], [550, 470]); await page.keyboard.up('Alt');
            await expect.poll(async () => (await state(page)).nodes).toBe(beforeDuplicate.nodes + 1);
            const drawn = await state(page);
            expect(drawn.width).toBeCloseTo(100, 0); expect(drawn.height).toBeCloseTo(80, 0);
            expect(drawn.x + drawn.width / 2).toBeCloseTo(500, 0); expect(drawn.y + drawn.height / 2).toBeCloseTo(430, 0);
          '''
          p.write_text(s.replace(old, old + '\n' + '\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines())))
          p = Path('CHANGELOG.md'); s = p.read_text()
          p.write_text(s.replace('## 0.2.0-alpha.2\n', '## 0.2.0-alpha.2\n\n- Normalize missing Alt pointer modifiers from Uno keyboard state for resize, drawing, duplication and tangent gestures.\n', 1))
          p = Path('docs/RESIZING.md'); s = p.read_text()
          p.write_text(s.replace('## Regression coverage', '## Browser modifier routing\n\nThe Uno Skia browser pointer bridge forwards Ctrl/Shift but not Alt. Canvas gestures combine routed Alt flags with the platform keyboard state instead of maintaining a separate sticky modifier cache. Browser acceptance also covers Alt-drag duplication and centered Alt drawing.\n\n## Regression coverage'))
          PY
      - name: Validate existing regressions and native workbench
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit verified interaction fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VectorSpace.Editor/DesignSurface.cs tests/browser/resize.spec.mjs CHANGELOG.md docs/RESIZING.md
          git commit -m 'fix: preserve Alt state through Uno browser pointer dispatch'
          git push origin HEAD:fix/resize-anchors-and-sizing
