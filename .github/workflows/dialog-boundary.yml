name: Validate scoped modal boundaries
on:
  push:
    branches: ['feat/collaboration-0.6']
    paths: ['.github/workflows/dialog-boundary.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Replace event-counted dialog lifetimes with awaited scopes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('src/VectorSpace.Workbench')
          for p in base.glob('*.cs'):
              if p.name=='StudioWorkbench.Invitation.cs': continue
              s=p.read_text()
              s=s.replace('await dialog.ShowAsync()', 'await ShowDialogAsync(dialog)')
              s=re.sub(r'await Dialog\((.*?)\)\.ShowAsync\(\)',r'await ShowDialogAsync(Dialog(\1))',s)
              p.write_text(s)
          p=base/'StudioWorkbench.Commands.cs';s=p.read_text()
          assert '=> TrackSharedDialog(new()' in s
          s=s.replace('=> TrackSharedDialog(new()', '=> new()')
          assert 'MinWidth = 320, MaxWidth = 560\n    });' in s
          p.write_text(s.replace('MinWidth = 320, MaxWidth = 560\n    });','MinWidth = 320, MaxWidth = 560\n    };'))
          (base/'StudioWorkbench.Invitation.cs').write_text('''namespace VectorSpace.Workbench;

          public sealed partial class StudioWorkbench
          {
              /// <summary>Reviews an invitation without automatically contacting its server.</summary>
              public void OpenCollaborationInvitation(string link)
              {
                  if (string.IsNullOrWhiteSpace(link) || link.Length > 8192) return;
                  PendingInvitation = link; RunAsync(ShowShareAsync);
              }
              /// <summary>The await owns the modal boundary. Presentation Opened/Closed events
              /// are not a balanced lifetime contract and must not retain a remote-delivery lock.</summary>
              private async Task<ContentDialogResult> ShowDialogAsync(ContentDialog dialog)
              {
                  _sharedDialogDepth++;
                  try { return await dialog.ShowAsync(); }
                  finally
                  {
                      _sharedDialogDepth--;
                      DispatcherQueue.TryEnqueue(FlushRemoteDeliveries);
                  }
              }
          }
          ''')
          p=base/'StudioWorkbench.SharedHistory.cs';s=p.read_text()
          old='json.WriteBoolean("recoverySaved", _sharedRecoverySaved); json.WriteEndObject();'
          assert s.count(old)==1
          p.write_text(s.replace(old,'''json.WriteNumber("dialogDepth", _sharedDialogDepth); json.WriteNumber("asyncDepth", _sharedAsyncDepth);
                  json.WriteNumber("queuedRemote", _remoteDeliveries.Count); json.WriteBoolean("boundaryBlocked", SharedBoundaryBlocked);
                  json.WriteBoolean("recoverySaved", _sharedRecoverySaved); json.WriteEndObject();'''))
          p=base/'StudioWorkbench.Collaboration.cs';s=p.read_text()
          old='if (changesModel && SharedBoundaryBlocked) _remoteDeliveries.Enqueue((action, done));'
          assert s.count(old)==1
          p.write_text(s.replace(old,'''if (changesModel && SharedBoundaryBlocked)
                      {
                          _remoteDeliveries.Enqueue((action, done));
                          _status.Text = "Remote changes are waiting for the active edit to finish";
                      }'''))
          p=Path('tests/browser/collaboration-helpers.mjs');s=p.read_text()
          old="await expect.poll(async () => (await shared(page)).role).toBe(grant.role);"
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'''
            // Joining must release both the modal and command boundary before authoring.
            await expect.poll(async () => (await shared(page)).dialogDepth).toBe(0);
            await expect.poll(async () => (await shared(page)).asyncDepth).toBe(0);
            await expect.poll(async () => (await shared(page)).boundaryBlocked).toBe(false);'''))
          p=Path('tests/browser/collaboration-sharing.spec.mjs');s=p.read_text()
          old="await page.keyboard.press('ArrowRight'); await synced(page, 2); await synced(bob, 2);"
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'''
            for (let i = 0; i < 3; i++) {
              await click(bob, 'Share');
              await expect.poll(async () => (await shared(bob)).dialogDepth).toBe(1);
              await click(bob, 'Close');
              await expect.poll(async () => (await shared(bob)).boundaryBlocked).toBe(false);
            }'''))
          remaining=[str(p) for p in base.glob('*.cs') if p.name!='StudioWorkbench.Invitation.cs' and '.ShowAsync()' in p.read_text()]
          assert not remaining,remaining
          PY
      - name: Compile the actual Uno modal integration
        run: |
          dotnet run --project tests/VectorSpace.Collaboration.Tests -c Release
          dotnet run --project tests/VectorSpace.Collaboration.EditorTests -c Release
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit checked scopes and remove this integration workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/dialog-boundary.yml
          git add src/VectorSpace.Workbench tests/browser/collaboration-helpers.mjs tests/browser/collaboration-sharing.spec.mjs .github/workflows/dialog-boundary.yml
          git diff --cached --check
          git commit -m 'fix: release collaboration modal boundaries through awaited dialog scopes'
          git push origin HEAD:feat/collaboration-0.6
