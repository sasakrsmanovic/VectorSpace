name: Native validation dependencies
on:
  push:
    branches: ['feat/editor-parity-0.2']
    paths: ['.github/workflows/native-validation-dependencies.yml']
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/validation-dependencies
          python3 - <<'PY'
          import pathlib, urllib.request
          for name, version in [('commonservicelocator','2.0.5'),('directnaot','1.6.1'),('directnaot.extensions','1.6.1')]:
              url=f'https://api.nuget.org/v3-flatcontainer/{name}/{version}/{name}.{version}.nupkg'
              urllib.request.urlretrieve(url, pathlib.Path('/tmp/validation-dependencies') / f'{name}.{version}.nupkg')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: VectorSpace-native-validation-dependencies
          path: /tmp/validation-dependencies
          retention-days: 7
