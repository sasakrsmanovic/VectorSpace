name: Parity dependency audit
on:
  push:
    branches: ['feat/editor-parity-0.2']
    paths: ['.github/workflows/parity-audit.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Snapshot source and pending pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/vectorspace-audit
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create /tmp/vectorspace-audit/repository.bundle --all
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req))
          report=[]
          for p in get('pulls?state=open&per_page=100'):
              n=p['number']; sha=p['head']['sha']
              checks=get('commits/'+sha+'/check-runs?per_page=100')['check_runs']
              files=get('pulls/'+str(n)+'/files?per_page=100')
              item={'number':n, 'title':p['title'], 'head':sha, 'branch':p['head']['ref'], 'base':p['base']['sha'], 'checks':[(c['name'],c['status'],c['conclusion']) for c in checks], 'files':[{'path':f['filename'],'patch':f.get('patch','')} for f in files]}
              report.append(item)
          pathlib.Path('/tmp/vectorspace-audit/pr-audit.json').write_text(json.dumps(report,indent=2))
          print(json.dumps([{'number':p['number'],'title':p['title'],'checks':p['checks']} for p in report],indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: VectorSpace-parity-workspace
          path: /tmp/vectorspace-audit
          retention-days: 7
