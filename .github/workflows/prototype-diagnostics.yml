name: Prototype import diagnostics
on:
  push:
    branches: ['feat/prototype-runtime-0.3']
    paths: ['.github/workflows/prototype-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate exactly the browser fixture with the native document loader
        run: |
          mkdir -p artifacts/prototype-diagnostic
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const text = fs.readFileSync('tests/browser/prototype.spec.mjs', 'utf8');
          const source = text.slice(text.indexOf('function fixture()'), text.indexOf('async function open('));
          fs.writeFileSync('artifacts/prototype-diagnostic/fixture.json', JSON.stringify(vm.runInNewContext(source + '; fixture()')));
          JS
          mkdir -p /tmp/vectorspace-prototype-diagnostic
          cat > /tmp/vectorspace-prototype-diagnostic/diagnostic.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><ProjectReference Include="$PWD/src/VectorSpace.Documents/VectorSpace.Documents.csproj" /></ItemGroup></Project>
          EOF
          cat > /tmp/vectorspace-prototype-diagnostic/Program.cs <<'CS'
          using VectorSpace.Documents;
          try {
              var document = DocumentJson.Load(File.ReadAllText(args[0]));
              Console.WriteLine($"LOAD OK: {document.Pages[0].Name}; {document.AllNodes().Count()} nodes");
          } catch (Exception error) { Console.WriteLine(error); Environment.ExitCode = 1; }
          CS
          dotnet run --project /tmp/vectorspace-prototype-diagnostic -- "$PWD/artifacts/prototype-diagnostic/fixture.json"
      - uses: actions/download-artifact@v8
        if: always()
        with:
          name: VectorSpace-browser-validation
          run-id: 36346122762
          github-token: ${{ github.token }}
          path: artifacts/previous-browser
      - name: Report actual browser error contexts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('artifacts/previous-browser').rglob('error-context.md'):
              print('\n---', path, '---\n', path.read_text()[-16000:])
          PY
