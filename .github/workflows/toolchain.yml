name: Resolve and validate Uno toolchain
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/toolchain.yml']
permissions:
  contents: write
jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve latest stable Uno packages
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for package in ['uno.sdk', 'uno.templates', 'uno.winui', 'skiasharp', 'skiasharp.views.uno.winui']:
              versions=json.load(urllib.request.urlopen('https://api.nuget.org/v3-flatcontainer/'+package+'/index.json'))['versions']
              stable=[v for v in versions if '-' not in v]
              print(package, stable[-1])
          PY
          dotnet new install Uno.Templates
          dotnet new unoapp --help > /tmp/uno-template-help.txt
          cat /tmp/uno-template-help.txt
      - name: Create reference browser and desktop host
        run: |
          mkdir -p /tmp/uno-reference
          cd /tmp/uno-reference
          dotnet new unoapp -n VectorSpace.App -o . --preset blank --platforms wasm desktop --markup xaml --presentation none
          find . -type f | sort
          find . -name '*.csproj' -o -name 'global.json' -o -name 'App.xaml.cs' -o -name 'Program.cs' -o -name 'Directory.Build.props' | xargs -I{} sh -c 'echo ===== {}; cat "{}"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-reference
          path: |
            /tmp/uno-reference
            /tmp/uno-template-help.txt
          include-hidden-files: true
