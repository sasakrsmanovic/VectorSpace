name: Integrate validated appearance implementation
on:
  push:
    branches: ['feat/appearance-parity-0.4']
    paths: ['.github/workflows/integrate-appearance.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify and apply authored source
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          root=pathlib.Path('scripts/appearance-transfer')
          data=''.join(p.read_text().strip() for p in sorted(root.glob('*.b64')))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7a66268d38b873dd0bf0a823083a868ac99251fd9fcffe9faec6d10cc87dd881', 'Authored source checksum mismatch'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path=line[6:]
                  assert '..' not in path.split('/') and (path.startswith(('src/','tests/','docs/')) or path in ('README.md','CHANGELOG.md','Directory.Build.props','.gitignore'))
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          PY
      - name: Validate engines and reusable native workbench
        run: |
          dotnet run --project tests/VectorSpace.Tests -c Release
          python3 -m unittest discover -s tests/scripts -v
          dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -r scripts/appearance-transfer
          git add src tests docs README.md CHANGELOG.md Directory.Build.props .gitignore scripts/appearance-transfer
          git commit -m 'feat: add image fills, direct crop editing, layered effects and retained appearance resources'
          git push origin HEAD:feat/appearance-parity-0.4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: appearance-transfer-diagnostic
          path: scripts/appearance-transfer
          if-no-files-found: ignore
          retention-days: 1
