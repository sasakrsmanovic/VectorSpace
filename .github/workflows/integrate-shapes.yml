name: Integrate shape engine
on:
  push:
    branches: ['feat/shape-stroke-editing-0.8']
    paths: ['.github/workflows/integrate-shapes.yml', 'scripts/integrate-shapes.py']
permissions:
  contents: write
concurrency:
  group: integrate-shapes
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: python3 scripts/integrate-shapes.py
      - name: Engine regression validation
        run: dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Compile reusable Uno workbench
        run: dotnet build src/VectorSpace.Workbench -f net10.0-desktop -c Release -p:VectorSpaceDesktopOnly=true
      - name: Preserve validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/integrate-shapes.py
          git add src tests Directory.Build.props scripts/integrate-shapes.py
          git commit -m 'feat: integrate exact primitive paths, live Booleans and cached aligned strokes'
          git push origin HEAD:feat/shape-stroke-editing-0.8
      - name: Record integration diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          git diff > artifacts/shape-integration.patch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: shape-integration-diagnostics
          path: artifacts/shape-integration.patch
