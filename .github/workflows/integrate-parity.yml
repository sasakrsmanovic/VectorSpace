name: Integrate validated editor parity
on:
  push:
    branches: ['feat/editor-parity-0.2']
    paths: ['.github/workflows/integrate-parity.yml']
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/editor-parity-0.2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply checksum-verified authored source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('scripts/parity-transfer')
          data = ''.join(p.read_text().strip() for p in sorted(root.glob('*.b64')))
          data = data.replace('DDNYSuy2W1w', 'DDNYSvy2W1w')
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fbfc07a3fbd22d1507b0345795f40f9d3e2ca4f1224b5ebb2d4ff2ee224774cb', 'Authored patch checksum mismatch'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert (path.startswith(('src/', 'tests/', 'docs/')) or path in ('README.md', 'CHANGELOG.md', 'Directory.Build.props')) and '..' not in path.split('/')
          subprocess.run(['git','apply','--unidiff-zero','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'], input=patch, check=True)
          PY
      - name: Run 145 engine and design-system regressions
        run: dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Commit validated source and remove transfer files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -r scripts/parity-transfer
          git add src tests docs README.md CHANGELOG.md Directory.Build.props scripts/parity-transfer
          git commit -m 'feat: add typed variables, component variants, stable instances and indexed snapping'
          git push origin HEAD:feat/editor-parity-0.2
          gh workflow run build.yml --ref feat/editor-parity-0.2
          gh workflow run desktop.yml --ref feat/editor-parity-0.2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parity-transfer-diagnostic
          path: scripts/parity-transfer
          if-no-files-found: ignore
