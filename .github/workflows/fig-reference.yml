name: Prepare pinned fig codec reference
on:
  push:
    branches: ['feat/editor-parity-0.2']
    paths: ['.github/workflows/fig-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Obtain pinned open-source codec reference and compression package
        run: |
          mkdir -p /tmp/reference
          curl --fail -L https://api.github.com/repos/SuperJMN/Zafiro.FigReader.Mcp/tarball/dc2089fae428f8a84e224ec2395d64423e4607df -o /tmp/reference/fig-reader.tar.gz
          dotnet new classlib -n Compression -o /tmp/compression --framework net10.0
          dotnet add /tmp/compression/Compression.csproj package ZstdSharp.Port --version 0.8.8
          tar -C "$HOME/.nuget" -czf /tmp/reference/zstd-package.tar.gz packages/zstdsharp.port
      - uses: actions/upload-artifact@v7
        with:
          name: VectorSpace-fig-codec-reference
          path: /tmp/reference
          retention-days: 7
