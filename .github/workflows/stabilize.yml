name: Stabilize validated alpha
on:
  push:
    paths: ['scripts/stabilize-source.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: VectorSpace-browser-validation
          run-id: 36307529097
          github-token: ${{ github.token }}
          path: /tmp/verified-browser
      - name: Apply integration and retain real browser preview
        run: |
          python3 scripts/stabilize-source.py
          mkdir -p docs/images
          cp /tmp/verified-browser/screenshots/workbench-desktop.png docs/images/workbench.png
          dotnet run --project tests/VectorSpace.Tests -c Release
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts README.md docs/images/workbench.png
          git commit -m 'fix: stabilize gesture cancellation, restored layer actions and vector sample icons'
          git push origin HEAD:main
