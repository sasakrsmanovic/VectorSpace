name: Split development dependencies
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/split-dependencies.yml']
permissions:
  actions: read
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vectorspace-packages
          run-id: 36304864778
          github-token: ${{ github.token }}
          path: /tmp/packages
      - run: split -b 350M /tmp/packages/vectorspace-packages.tar.gz /tmp/nuget-part-
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-part-aa
          path: /tmp/nuget-part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-part-ab
          path: /tmp/nuget-part-ab
          compression-level: 0
          retention-days: 1
